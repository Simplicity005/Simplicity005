<svg xmlns="http://www.w3.org/2000/svg" width="112" height="32" viewBox="0 0 112 32" role="img" aria-label="Portfolio">
  <style>
    .b-hi { fill: #484F58; }
    .b-lo { fill: #262C36; }
    .b-mid { fill: #30363D; }
    .b-dim { fill: #21262D; }
    .s-icon { stroke: #7D8590; fill: none; }
    .f-icon { fill: #7D8590; }
    .fg-1 { fill: #E6EDF3; }
    .fg-2 { fill: #9DA7B3; }
    .fg-3 { fill: #6E7681; }
    .sans { font-family: Tahoma, 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SF Mono', 'JetBrains Mono', Menlo, 'Liberation Mono', monospace; }
    @media (prefers-color-scheme: light) {
      .b-hi { fill: #AEB7C0; }
      .b-lo { fill: #6E7781; }
      .b-mid { fill: #D0D7DE; }
      .b-dim { fill: #E6EAEF; }
      .s-icon { stroke: #59636E; fill: none; }
      .f-icon { fill: #59636E; }
      .fg-1 { fill: #1F2328; }
      .fg-2 { fill: #59636E; }
      .fg-3 { fill: #6E7781; }
    }
  </style>
  <g shape-rendering="crispEdges">
    <rect class="b-hi" x="0" y="0" width="111" height="1"/>
    <rect class="b-hi" x="0" y="0" width="1" height="31"/>
    <rect class="b-lo" x="0" y="31" width="112" height="1"/>
    <rect class="b-lo" x="111" y="0" width="1" height="32"/>
  </g>
  <g>
    <text class="mono fg-1" x="56.0" y="20.5" text-anchor="middle" font-size="12">Portfolio</text>
  </g>
</svg>
