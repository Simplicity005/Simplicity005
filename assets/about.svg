  <g>
    <text class="mono fg-3" x="26" y="19" font-size="11.5">C:\arjun\about.txt</text>
    <path class="s-icon" d="M840.5 11.5 L847.5 18.5 M847.5 11.5 L840.5 18.5" stroke-width="1.25"/>
    <text class="sans fg-2" x="26" y="54" font-size="13.5">I'm currently living under a cemented rock, where I play with hardware and software, see what works,</text>
    <text class="sans fg-2" x="26" y="75" font-size="13.5">and learn from what doesn't. I like things that are small, fast, and clean, and I like them even more</text>
    <text class="sans fg-2" x="26" y="96" font-size="13.5">when they have wires attached.</text>
    <text class="mono fg-3" x="26" y="138" font-size="12">focus</text>
    <text class="mono fg-1" x="132" y="138" font-size="12">Clean, efficient software</text>
    <text class="mono fg-3" x="26" y="159" font-size="12">exploring</text>
    <text class="mono fg-1" x="132" y="159" font-size="12">Embedded systems, interactive UI design</text>
    <text class="mono fg-3" x="26" y="180" font-size="12">off_duty</text>
    <text class="mono fg-1" x="132" y="180" font-size="12">Watching F1, building tools for daily annoyances</text>
