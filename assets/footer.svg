<svg xmlns="http://www.w3.org/2000/svg" width="860" height="30" viewBox="0 0 860 30" role="img" aria-label="Always building. Occasionally breaking things on purpose.">
  <style>
    .b-hi { fill: #484F58; }
    .b-lo { fill: #262C36; }
    .b-mid { fill: #30363D; }
    .b-dim { fill: #21262D; }
    .s-icon { stroke: #7D8590; fill: none; }
    .f-icon { fill: #7D8590; }
    .fg-1 { fill: #E6EDF3; }
    .fg-2 { fill: #9DA7B3; }
    .fg-3 { fill: #6E7681; }
    .sans { font-family: Tahoma, 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SF Mono', 'JetBrains Mono', Menlo, 'Liberation Mono', monospace; }
    @media (prefers-color-scheme: light) {
      .b-hi { fill: #AEB7C0; }
      .b-lo { fill: #6E7781; }
      .b-mid { fill: #D0D7DE; }
      .b-dim { fill: #E6EAEF; }
      .s-icon { stroke: #59636E; fill: none; }
      .f-icon { fill: #59636E; }
      .fg-1 { fill: #1F2328; }
      .fg-2 { fill: #59636E; }
      .fg-3 { fill: #6E7781; }
    }
  </style>
  <g shape-rendering="crispEdges">
    <rect class="b-hi" x="0" y="0" width="859" height="1"/>
    <rect class="b-hi" x="0" y="0" width="1" height="29"/>
    <rect class="b-lo" x="0" y="29" width="860" height="1"/>
    <rect class="b-lo" x="859" y="0" width="1" height="30"/>
    <rect class="b-lo" x="4" y="4" width="709" height="1"/>
    <rect class="b-lo" x="4" y="4" width="1" height="21"/>
    <rect class="b-hi" x="4" y="25" width="710" height="1"/>
    <rect class="b-hi" x="713" y="4" width="1" height="22"/>
    <rect class="b-lo" x="717" y="4" width="138" height="1"/>
    <rect class="b-lo" x="717" y="4" width="1" height="21"/>
    <rect class="b-hi" x="717" y="25" width="139" height="1"/>
    <rect class="b-hi" x="855" y="4" width="1" height="22"/>
  </g>
  <g>
    <text class="mono fg-3" x="13" y="19" font-size="11">Always building. Occasionally breaking things on purpose.</text>
    <text class="mono fg-3" x="727" y="19" font-size="11">EOF</text>
  </g>
</svg>
